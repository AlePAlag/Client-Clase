<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predicción de Diabetes</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      width: 400px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
      color: #34495e;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    input:focus {
      border-color: #2980b9;
      outline: none;
      box-shadow: 0 0 6px rgba(41, 128, 185, 0.3);
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #2980b9;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #1f6391;
    }
    #response {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #ecf0f1;
      color: #2c3e50;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Formulario del Paciente</h2>
    <form id="patientForm">
      <label for="first_name">Nombre:</label>
      <input type="text" id="first_name" name="first_name" required>

      <label for="last_name">Apellido:</label>
      <input type="text" id="last_name" name="last_name" required>

      <label for="identification_number">Número de Identificación:</label>
      <input type="text" id="identification_number" name="identification_number" required>

      <label for="pregnancles">Embarazos:</label>
      <input type="number" id="pregnancles" name="pregnancles" required>

      <label for="glucose">Glucosa:</label>
      <input type="number" id="glucose" name="glucose" required>

      <label for="bloodpressure">Presión Arterial:</label>
      <input type="number" id="bloodpressure" name="bloodpressure" required>

      <label for="skinthickness">Espesor de Piel:</label>
      <input type="number" id="skinthickness" name="skinthickness" required>

      <label for="insulin">Insulina:</label>
      <input type="number" id="insulin" name="insulin" required>

      <label for="bmi">Índice de Masa Corporal (BMI):</label>
      <input type="number" step="0.1" id="bmi" name="bmi" required>

      <label for="diabetespedugreefunction">Función de Pedigrí de Diabetes:</label>
      <input type="number" step="0.001" id="diabetespedugreefunction" name="diabetespedugreefunction" required>

      <label for="age">Edad:</label>
      <input type="number" id="age" name="age" required>

      <button type="submit">Predicción</button>
    </form>

    <div id="response"></div>
  </div>

  <script>
    document.getElementById("patientForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const data = {
        first_name: document.getElementById("first_name").value,
        last_name: document.getElementById("last_name").value,
        identification_number: document.getElementById("identification_number").value,
        pregnancles: parseInt(document.getElementById("pregnancles").value),
        glucose: parseInt(document.getElementById("glucose").value),
        bloodpressure: parseInt(document.getElementById("bloodpressure").value),
        skinthickness: parseInt(document.getElementById("skinthickness").value),
        insulin: parseInt(document.getElementById("insulin").value),
        bmi: parseFloat(document.getElementById("bmi").value),
        diabetespedugreefunction: parseFloat(document.getElementById("diabetespedugreefunction").value),
        age: parseInt(document.getElementById("age").value)
      };

      try {
        const response = await fetch("https://aiclase-slhi.onrender.com/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        document.getElementById("response").textContent = JSON.stringify(result, null, 2);
      } catch (error) {
        document.getElementById("response").textContent = "Error al conectar con el servidor: " + error;
      }
    });
  </script>
</body>
</html>
